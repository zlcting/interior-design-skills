</style><main><h1>白模v4 · 清晰度前后对照</h1><p>加强白灰明暗分层，收紧墙体、柜体与桌边，统一输出2400×1800、128采样。沙发软包与植物保留柔软曲面；画面直接由3D场景渲染。</p><nav><a href="comparison.html">四风格总对比</a><a href="visuals/style-variants/white-minimal-crisp-v4/interior.blend">v4 Blender模型</a><a href="visuals/style-variants/white-minimal-crisp-v4/interior.glb">v4 GLB模型</a><a href="living-refinement.html">历史：v3客厅样板</a></nav><p class="note">拖动滑块比较相同机位。点击原图，再以原始大小查看细线；页面中的缩略显示不能呈现全部高分辨率细节。</p><section><h2>全屋轴测</h2><figure><div class="comparison"><img src="visuals/style-variants/white-minimal-living-v3/axon.png" alt="v3 全屋轴测"><img class="after" src="visuals/style-variants/white-minimal-crisp-v4/axon.png" alt="v4 全屋轴测"><div class="marker"></div></div><div class="control"><div class="labels"><span>左：v4 · 本轮</span><span>右：v3 · 上一轮</span></div><input aria-label="全屋轴测前后对比" type="range" min="0" max="100" value="50" oninput="const f=this.closest('figure');f.querySelector('.after').style.clipPath='inset(0 '+(100-this.value)+'% 0 0)';f.querySelector('.marker').style.left=this.value+'%'"></div><figcaption><a href="visuals/style-variants/white-minimal-crisp-v4/axon.png">打开v4原图 · 2400×1800</a> · <a href="visuals/style-variants/white-minimal-living-v3/axon.png">打开v3原图 · 1600×1200</a></figcaption></figure></section><section><h2>客厅近景</h2><figure><div class="comparison"><img src="visuals/style-variants/white-minimal-living-v3/living-close.png" alt="v3 客厅近景"><img class="after" src="visuals/style-variants/white-minimal-crisp-v4/living-close.png" alt="v4 客厅近景"><div class="marker"></div></div><div class="control"><div class="labels"><span>左：v4 · 本轮</span><span>右：v3 · 上一轮</span></div><input aria-label="客厅近景前后对比" type="range" min="0" max="100" value="50" oninput="const f=this.closest('figure');f.querySelector('.after').style.clipPath='inset(0 '+(100-this.value)+'% 0 0)';f.querySelector('.marker').style.left=this.value+'%'"></div><figcaption><a href="visuals/style-variants/white-minimal-crisp-v4/living-close.png">打开v4原图 · 2400×1800</a> · <a href="visuals/style-variants/white-minimal-living-v3/living-close.png">打开v3原图 · 1600×1200</a></figcaption></figure></section><section class="grid"><figure><a href="references/white-minimal-reference.png"><img src="references/white-minimal-reference.png" alt="用户提供的参考效果"></a><figcaption>参考效果图 · 比较边界、明暗和材质质感。</figcaption></figure><figure><a href="visuals/style-variants/white-minimal-crisp-v4/living-detail.png"><img src="visuals/style-variants/white-minimal-crisp-v4/living-detail.png" alt="v4客厅轴测"></a><figcaption>本轮客厅轴测 · v4。</figcaption></figure></section><p class="note">所有既有版本保留。主模型户型、家具位置与外包尺寸保持原设计设定。</p></main></html>
